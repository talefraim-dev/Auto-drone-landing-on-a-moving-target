observation_vector:
  version: 1
  size: 28
  shared_for_agents:
    - follow_agent
    - static_landing_agent
    - moving_landing_agent
  features:
    - {index: 0,  name: has_target,             source: vision_tracker, range: "0/1"}
    - {index: 1,  name: bbox_cx,                source: vision, range: "0..1"}
    - {index: 2,  name: bbox_cy,                source: vision, range: "0..1"}
    - {index: 3,  name: bbox_w,                 source: vision, range: "0..1"}
    - {index: 4,  name: bbox_h,                 source: vision, range: "0..1"}
    - {index: 5,  name: bbox_area,              source: vision, range: "0..1"}
    - {index: 6,  name: bbox_conf,              source: vision_tracker, range: "0..1"}
    - {index: 7,  name: err_x,                  source: computed, range: "-1..1"}
    - {index: 8,  name: err_y,                  source: computed, range: "-1..1"}
    - {index: 9,  name: img_vx,                 source: computed, range: "clipped"}
    - {index: 10, name: img_vy,                 source: computed, range: "clipped"}
    - {index: 11, name: img_ax,                 source: computed, range: "clipped"}
    - {index: 12, name: img_ay,                 source: computed, range: "clipped"}
    - {index: 13, name: area_delta_norm,        source: computed, range: "-1..1"}
    - {index: 14, name: distance_proxy_norm,    source: computed, range: "0..1"}
    - {index: 15, name: distance_proxy_delta,   source: computed, range: "-1..1"}
    - {index: 16, name: altitude_norm,          source: sim_sensor, range: "0..1"}
    - {index: 17, name: drone_vx_norm,          source: sim_sensor, range: "-1..1"}
    - {index: 18, name: drone_vy_norm,          source: sim_sensor, range: "-1..1"}
    - {index: 19, name: drone_vz_norm,          source: sim_sensor, range: "-1..1"}
    - {index: 20, name: drone_roll_norm,        source: sim_sensor, range: "-1..1"}
    - {index: 21, name: drone_pitch_norm,       source: sim_sensor, range: "-1..1"}
    - {index: 22, name: drone_yaw_rate_norm,    source: sim_sensor, range: "-1..1"}
    - {index: 23, name: drone_speed_xy_norm,    source: sim_sensor, range: "0..1"}
    - {index: 24, name: centered_score,         source: computed, range: "0..1"}
    - {index: 25, name: target_stability_score, source: computed, range: "0..1"}
    - {index: 26, name: landing_allowed,        source: computed, range: "0/1"}
    - {index: 27, name: lost_target_time_norm,  source: tracker_env, range: "0..1"}
